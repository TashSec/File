:root {
  --sky: #5BCEFA;
  --sky-pale: #D7F2FD;
  --sky-deep: #3A9FCB;
  --glass: #6DB9DA;
  --petal: #F5A9B8;
  --petal-pale: #FCE1E8;
  --petal-deep: #E07E95;
  --snow: #FFFFFF;
  --ink: #2E2A4F;
  --ink-soft: #5E5A80;
  --hand: "Gochi Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { min-height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
  color: var(--ink);
  font-family: var(--body);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  /* Soft blue / pink / white bands, blended like a sunrise */
  background: linear-gradient(180deg,
    var(--sky-pale) 0%,
    var(--petal-pale) 27%,
    var(--snow) 50%,
    var(--petal-pale) 73%,
    var(--sky-pale) 100%);
}

.stage {
  width: 100%;
  max-width: 520px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.title {
  margin: 0;
  font-family: var(--hand);
  font-weight: 400;
  font-size: clamp(2.3rem, 8vw, 3.3rem);
  line-height: 1;
  letter-spacing: 0.01em;
}

.sub {
  margin: 0.55rem 0 0;
  max-width: 32ch;
  color: var(--ink-soft);
  font-size: 1rem;
  line-height: 1.45;
}

.jar-wrap {
  width: min(76vw, 290px, 38vh);
  margin: 1.5rem 0 0.3rem;
}

#jar {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

.sub, .msg, .game-panel p, .rob-inner { text-wrap: balance; }

.msg {
  min-height: 2.5em;
  max-width: 30ch;
  margin: 0.2rem 0 0.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--hand);
  font-size: 1.45rem;
  line-height: 1.2;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
}

.btn {
  font-family: var(--hand);
  font-size: 1.4rem;
  line-height: 1;
  border-radius: 999px;
  padding: 0.55em 1.3em;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.12s, box-shadow 0.12s, color 0.15s, background-color 0.15s;
}

.btn-tip {
  background: var(--petal);
  color: var(--ink);
  border: 2px solid var(--ink);
  box-shadow: 0 4px 0 var(--ink);
}
.btn-tip:hover { background: #F8BCC8; }
.btn-tip:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

.btn-take {
  background: none;
  border: 2px solid transparent;
  color: var(--ink-soft);
  padding-inline: 0.8em;
  text-decoration: underline;
  text-decoration-thickness: 1.5px;
  text-underline-offset: 0.2em;
}
.btn-take:hover { color: var(--ink); }

.count {
  margin: 0.9rem 0 0;
  color: var(--ink-soft);
  font-size: 0.92rem;
}

:focus-visible {
  outline: 3px solid var(--sky-deep);
  outline-offset: 3px;
}

/* ---------- The "are you sure?" game ---------- */
.game {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(46, 42, 79, 0.24);
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
  cursor: crosshair;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

.game-panel {
  position: absolute;
  top: max(14px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100vw - 24px);
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 0.6rem 0.6rem 1.1rem;
  background: var(--snow);
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(46, 42, 79, 0.18);
  cursor: default;
}
.game-panel p {
  margin: 0;
  font-size: 0.98rem;
  line-height: 1.35;
  text-align: left;
}

.btn-never {
  flex: none;
  font-family: var(--hand);
  font-size: 1.15rem;
  line-height: 1;
  color: var(--ink);
  background: var(--sky-pale);
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 0.4em 0.95em;
  cursor: pointer;
}

.rob {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 21;
  max-width: min(70vw, 290px);
  padding: 0.55em 1.1em;
  font-family: var(--hand);
  font-size: clamp(1.15rem, 3.6vw, 1.4rem);
  line-height: 1.1;
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 999px;
  box-shadow: 0 4px 0 var(--ink);
  cursor: pointer;
  touch-action: none;
  will-change: transform;
}
.rob-inner { display: block; }
.rob.c0 { background: var(--sky); }
.rob.c1 { background: var(--petal); }
.rob.c2 { background: var(--snow); }

/* ---------- Effects layer ---------- */
.fx {
  position: fixed;
  inset: 0;
  z-index: 30;
  pointer-events: none;
  overflow: hidden;
}
.p { position: absolute; left: 0; top: 0; width: 18px; height: 18px; }
.p svg { display: block; width: 100%; height: 100%; }
.p.w { filter: drop-shadow(0 0 1.5px var(--sky-deep)); }

.fly { position: absolute; left: 0; top: 0; width: 76px; height: 46px; margin: -23px 0 0 -38px; }
.fly svg { display: block; overflow: visible; }
.fly .wing-l { transform-box: fill-box; transform-origin: 100% 55%; animation: flapL 0.22s ease-in-out infinite alternate; }
.fly .wing-r { transform-box: fill-box; transform-origin: 0% 55%; animation: flapR 0.22s ease-in-out infinite alternate; }
@keyframes flapL { from { transform: rotate(16deg); } to { transform: rotate(-24deg); } }
@keyframes flapR { from { transform: rotate(-16deg); } to { transform: rotate(24deg); } }

.miss {
  position: absolute;
  font-family: var(--hand);
  font-size: 1.2rem;
  color: var(--ink);
  white-space: nowrap;
}

/* ---------- Jar artwork ---------- */
.hand { font-family: var(--hand); }
#jarAll { transform-origin: 130px 298px; }

.f { display: none; }
#jar[data-mood="idle"] .eyes-open,
#jar[data-mood="idle"] .m-idle,
#jar[data-mood="happy"] .eyes-happy,
#jar[data-mood="happy"] .m-happy,
#jar[data-mood="nervous"] .eyes-open,
#jar[data-mood="nervous"] .m-nervous,
#jar[data-mood="nervous"] .brows-up,
#jar[data-mood="nervous"] .sweat,
#jar[data-mood="sad"] .eyes-open,
#jar[data-mood="sad"] .m-sad,
#jar[data-mood="sad"] .brows-sad,
#jar[data-mood="sad"] .tear,
#jar[data-mood="sleep"] .eyes-closed,
#jar[data-mood="sleep"] .m-sleep,
#jar[data-mood="sleep"] .zzz { display: inline; }

.blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
@keyframes blink { 0%, 93%, 100% { transform: none; } 96% { transform: scaleY(0.12); } }

.tear { animation: tear 1.1s ease-in infinite; }
@keyframes tear {
  0% { transform: translateY(-2px); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: translateY(16px); opacity: 0; }
}

.sweat { animation: sweat 1.4s ease-in-out infinite; }
@keyframes sweat { 0%, 100% { transform: none; } 50% { transform: translateY(3px); } }

.zzz path { animation: zzz 2.6s ease-in-out infinite; }
.zzz path:nth-child(2) { animation-delay: 1.3s; }
@keyframes zzz {
  0% { transform: translate(0, 4px); opacity: 0; }
  30% { opacity: 1; }
  100% { transform: translate(-6px, -12px); opacity: 0; }
}

#jar[data-mood="nervous"] #jarAll { animation: tremble 0.16s linear infinite; }
@keyframes tremble { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(0.9px); } }

/* Cobweb + spider (only when the jar is empty) */
#web, #spider { display: none; }
#jar.is-empty #web, #jar.is-empty #spider { display: inline; }
#web path { fill: none; stroke: #8C88A8; stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 1; }
#thread { stroke: #8C88A8; stroke-width: 1.2; stroke-dasharray: 1; }
#spiderSwing { transform-origin: 182px 90px; }
#spiderLegs { transform-box: fill-box; transform-origin: center; animation: legs 0.6s ease-in-out infinite alternate; }
@keyframes legs { from { transform: scaleY(1); } to { transform: scaleY(0.86); } }

#jar.is-empty #web path { animation: draw 1.4s ease-out both; }
#jar.is-empty #thread { animation: draw 0.9s 0.9s ease-out both; }
#jar.is-empty #spiderBody { animation: descend 1.1s 0.9s cubic-bezier(0.3, 1.35, 0.5, 1) both; }
#jar.is-empty #spiderSwing { animation: swing 3.4s 2.2s ease-in-out infinite; }
#jar.is-empty.leaving #web { animation: fadeout 0.6s ease both; }
#jar.is-empty.leaving #thread { animation: undraw 0.6s ease-in both; }
#jar.is-empty.leaving #spiderBody { animation: ascend 0.6s ease-in both; }

@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes undraw { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 1; } }
@keyframes descend { from { transform: translateY(-96px); } to { transform: none; } }
@keyframes ascend { from { transform: none; } to { transform: translateY(-96px); opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes swing {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(5deg); }
  75% { transform: rotate(-5deg); }
}

@media (prefers-reduced-motion: reduce) {
  .blink, .zzz path, .sweat, #spiderLegs { animation: none; }
  #jar.is-empty #spiderSwing, #jar[data-mood="nervous"] #jarAll { animation: none; }
  .btn { transition: none; }
}
</style>

<script>
(() => {
  'use strict';

  /* ---------- Settings ---------- */
  const MAX_COINS = 12;   // coins needed to fill the jar to the brim
  const START_COINS = 6;  // how full the jar is whenever the page is opened

  /* ---------- Lines (add, remove or edit freely) ----------
     Each list is shuffled, and every line gets used once before any repeats. */

  // The jar, after someone leaves a tip
  const TIP_LINES = [
    'Thank you! You’ve made my day.',
    'Ooh, shiny. Thank you!',
    'Clink! Much appreciated.',
    'That’s going towards biscuits.',
    'You’re a gem. Thank you!',
    'Ka-ching! You’re a star.',

  // Someone gives up on robbing ("Never mind")
  const CANCEL_LINES = [

    'Crisis averted. Thank you!',
    'I knew you were one of the good ones.',
    'The coins can breathe again.',
    'Wise choice. Very wise.',
    'Admirable restraint.',
    'That’s the spirit. Hands off the coins.'
  ];

  // The jar, after a coin has been taken
  const SAD_LINES = [

    'Oh. Okay then.',
    'The jar will remember this.',

  // A coin has been taken and only one is left
  const LAST_ONE_LINES = [

    'Down to my last coin. Have a heart.',
    'One coin left. It’s all I have.',
    'That’s nearly everything. Was it worth it?',

  ];

  // The very last coin has gone
  const EMPTY_LINES = [

    'All gone. A spider has moved in.',
    'Empty. The spider says hello.',
    'Cleaned out. Even the spider looks disappointed.',

  ];

  // Instructions at the top of the chase screen
  const PROMPT_LINES = [

    'If you really want it, you’ll have to catch it.',
    'The jar isn’t making this easy. Catch the button.',
    'Sure about this? Catch the button to confirm.',

  ];
  // ...when only one coin is left
  const PROMPT_LAST_LINES = [

    'One coin left. Good luck catching this.',

  ];

  // Text on the bouncing button
  const ROB_BUTTON_LINES = [
    'Yes, I’m sure I want to rob you',
    'Yes, take the coin',
    'Yes, I’m a coin goblin',
    'Gimme that coin',
    'Confirm the heist',
    'I have no shame. Take it.',
    'Yes, I’ve made peace with this',

  // ...when only one coin is left
  const ROB_BUTTON_LAST_LINES = [

    'Yes, even the last one',
    'Take it all, sorry not sorry',

  ];

  // Pops up where someone clicks and misses the button
  const MISS_LINES = [
    'missed!', 'nope!', 'too slow!', 'whoosh!', 'so close!',
    'not quite!', 'ha!', 'over here!', 'nearly!', 'try again!'
  ];

  /* ---------- Set-up ---------- */
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const svg = $('jar'), jarAll = $('jarAll'), coinsG = $('coins'), dropCoin = $('dropCoin'), web = $('web');
  const tipBtn = $('tipBtn'), takeBtn = $('takeBtn'), msg = $('msg'), countEl = $('count');
  const game = $('game'), panel = $('gamePanel'), gamePrompt = $('gamePrompt'), robBtn = $('robBtn'), robInner = $('robInner');
  const cancelBtn = $('cancelRob'), fx = $('fx');

  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const canAnimate = typeof Element.prototype.animate === 'function';

  let level = Math.max(0, Math.min(MAX_COINS, START_COINS));
  let busy = false;
  let moodTimer = 0;

  // Shuffle-bag: works through a list in a random order before reusing any line
  function bag(list) {
    let queue = [], last = null;
    return () => {
      if (!queue.length) {
        queue = list.slice();
        for (let i = queue.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [queue[i], queue[j]] = [queue[j], queue[i]];
        }
        if (queue.length > 1 && queue[0] === last) queue.push(queue.shift());
      }
      last = queue.shift();
      return last;
    };
  }

  const line = {
    tip: bag(TIP_LINES),
    full: bag(FULL_LINES),
    revive: bag(REVIVE_LINES),
    cancel: bag(CANCEL_LINES),
    sad: bag(SAD_LINES),
    lastOne: bag(LAST_ONE_LINES),
    empty: bag(EMPTY_LINES),
    prompt: bag(PROMPT_LINES),
    promptLast: bag(PROMPT_LAST_LINES),
    rob: bag(ROB_BUTTON_LINES),
    robLast: bag(ROB_BUTTON_LAST_LINES),
    miss: bag(MISS_LINES)
  };

  function play(el, frames, opts, done) {
    if (canAnimate) {
      const a = el.animate(frames, opts);
      if (done) a.onfinish = () => done(a);
      return a;
    }
    if (done) setTimeout(() => done(null), 0);
    return null;
  }

  function svgEl(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  // Seeded random so the coin pile looks the same on every visit
  let seed = 20260913;
  const srand = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };

  /* ---------- Coin pile ---------- */
  const STEP = Math.min(16, 174 / Math.max(1, MAX_COINS - 1));
  const rowY = (i) => 286 - i * STEP;
  const rows = [];
  for (let i = 0; i < MAX_COINS; i++) {
    const g = svgEl('g', { class: 'row' }, coinsG);
    const y = rowY(i);
    for (let x = 16 + (i % 2) * 13; x < 245; x += 26) {
      const cx = (x + (srand() - 0.5) * 8).toFixed(1);
      const cy = y + (srand() - 0.5) * 6;
      const tilt = ((srand() - 0.5) * 16).toFixed(1);
      const c = svgEl('g', { transform: `rotate(${tilt} ${cx} ${cy.toFixed(1)})` }, g);
      svgEl('ellipse', { cx, cy: (cy + 3.2).toFixed(1), rx: 17, ry: 7, fill: '#C98E1A' }, c);
      svgEl('ellipse', { cx, cy: cy.toFixed(1), rx: 17, ry: 7, fill: 'url(#coinFace)' }, c);
      svgEl('ellipse', { cx, cy: cy.toFixed(1), rx: 10.5, ry: 4, fill: 'none', stroke: '#D9A12A', 'stroke-width': 1.3 }, c);
    }
    g.style.display = i < level ? '' : 'none';
    rows.push(g);
  }

  /* ---------- Cobweb ---------- */
  (function buildWeb() {
    const A = { x: 186, y: 60 };
    const angles = [0, 27.5, 55, 82.5, 110].map((d) => d * Math.PI / 180);
    const pt = (a, r) => ({ x: A.x - Math.cos(a) * r, y: A.y + Math.sin(a) * r });
    angles.forEach((a) => {
      const p = pt(a, 58);
      svgEl('path', { d: `M${A.x},${A.y} L${p.x.toFixed(1)},${p.y.toFixed(1)}`, pathLength: 1 }, web);
    });
    [15, 28, 41, 54].forEach((r) => {
      let d = '';
      for (let i = 0; i < angles.length - 1; i++) {
        const p1 = pt(angles[i], r), p2 = pt(angles[i + 1], r);
        const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
        const qx = mx + (A.x - mx) * 0.22, qy = my + (A.y - my) * 0.22;
        if (i === 0) d += `M${p1.x.toFixed(1)},${p1.y.toFixed(1)} `;
        d += `Q${qx.toFixed(1)},${qy.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)} `;
      }
      svgEl('path', { d: d.trim(), pathLength: 1 }, web);
    });
  })();

  /* ---------- Helpers ---------- */
  const restMood = () => (level === 0 ? 'sleep' : 'idle');

  function setMood(mood, revertAfter) {
    svg.setAttribute('data-mood', mood);
    clearTimeout(moodTimer);
    if (revertAfter) moodTimer = setTimeout(() => svg.setAttribute('data-mood', restMood()), revertAfter);
  }

  function updateUI() {
    const s = level === 1 ? '' : 's';
    countEl.textContent = level === 0 ? 'The jar is empty'
      : level >= MAX_COINS ? `Full to the brim: ${level} coins`
      : `${level} coin${s} in the jar`;
    takeBtn.hidden = level === 0;
    svg.setAttribute('aria-label', level === 0
      ? 'An empty tip jar with a cobweb and a spider'
      : `Tip jar holding ${level} coin${s}`);
  }

  function say(text) {
    msg.textContent = text;
    if (text && !reduceMotion) {
      play(msg, [{ opacity: 0, transform: 'translateY(5px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'ease-out' });
    }
  }

  function toScreen(x, y) {
    const m = svg.getScreenCTM();
    if (!m) {
      const r = svg.getBoundingClientRect();
      return { x: r.left + r.width * x / 260, y: r.top + r.height * y / 320 };
    }
    return { x: m.a * x + m.c * y + m.e, y: m.b * x + m.d * y + m.f };
  }

  function wiggle() {
    if (reduceMotion) return;
    play(jarAll, [
      { transform: 'rotate(0deg)' },
      { transform: 'rotate(-3deg)' },
      { transform: 'rotate(2.4deg)' },
      { transform: 'rotate(-1.2deg)' },
      { transform: 'rotate(0deg)' }
    ], { duration: 520, easing: 'ease-out' });
  }

  const STAR = '<svg viewBox="0 0 20 20"><path d="M10 0C11 7 13 9 20 10C13 11 11 13 10 20C9 13 7 11 0 10C7 9 9 7 10 0Z" fill="currentColor"/></svg>';
  const HEART = '<svg viewBox="0 0 24 22"><path d="M12 21C5 15 0 11 0 6A6 6 0 0 1 12 4A6 6 0 0 1 24 6C24 11 19 15 12 21Z" fill="currentColor"/></svg>';
  const SPARKLE_COLOURS = ['#5BCEFA', '#F5A9B8', '#FFFFFF'];

  function sparkle() {
    if (reduceMotion || !canAnimate) return;
    const o = toScreen(130, 52);
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('span');
      const colour = SPARKLE_COLOURS[i % 3];
      p.className = 'p' + (colour === '#FFFFFF' ? ' w' : '');
      p.style.color = colour;
      p.innerHTML = i % 4 === 3 ? HEART : STAR;
      fx.appendChild(p);
      const ang = (-165 + Math.random() * 150) * Math.PI / 180;
      const dist = 55 + Math.random() * 95;
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      const rot = (Math.random() - 0.5) * 220;
      const base = `translate(${o.x - 9}px, ${o.y - 9}px)`;
      play(p, [
        { transform: `${base} translate(0px, 0px) scale(0.2) rotate(0deg)`, opacity: 1 },
        { transform: `${base} translate(${dx * 0.75}px, ${dy * 0.75}px) scale(1) rotate(${rot * 0.6}deg)`, opacity: 1, offset: 0.55 },
        { transform: `${base} translate(${dx}px, ${dy + 38}px) scale(0.6) rotate(${rot}deg)`, opacity: 0 }
      ], { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.3,1)' }, () => p.remove());
    }
  }

  /* ---------- Leave a tip ---------- */
  function tip() {
    if (busy) return;
    busy = true;
    const wasEmpty = level === 0;
    const full = level >= MAX_COINS;

    if (wasEmpty) {
      svg.classList.add('leaving');
      setTimeout(() => svg.classList.remove('is-empty', 'leaving'), 650);
    }
    setMood('happy');

    dropCoin.style.display = '';
    const startY = -150;
    const endY = full ? 40 : rowY(level) - 6;
    const n = 12, frames = [];
    for (let k = 0; k <= n; k++) {
      const y = startY + (endY - startY) * (k / n);
      const sx = k === n ? 1 : Math.max(0.12, Math.abs(Math.cos(k * 1.3)));
      frames.push({ transform: `translate(130px, ${y.toFixed(1)}px) scale(${sx.toFixed(2)}, 1)` });
    }

    play(dropCoin, frames, {
      duration: reduceMotion ? 250 : 620,
      easing: 'cubic-bezier(.55,.06,.68,.53)',
      fill: 'forwards'
    }, (a) => {
      if (full) { overflow(a); return; }
      dropCoin.style.display = 'none';
      if (a) a.cancel();
      const row = rows[level];
      row.style.display = '';
      play(row, [
        { transform: 'translateY(-18px)', opacity: 0 },
        { transform: 'translateY(2px)', opacity: 1, offset: 0.7 },
        { transform: 'translateY(0px)', opacity: 1 }
      ], { duration: 340, easing: 'ease-out' });
      level++;
      updateUI();
      wiggle();
      sparkle();
      say(wasEmpty ? line.revive() : line.tip());
      setMood('happy', 1800);
      busy = false;
    });
  }

  // Jar already full: the coin bounces off the rim and rolls away.
  // A copy does the rolling, so the next tip can drop in straight away.
  function overflow(first) {
    const roller = dropCoin.cloneNode(true);
    roller.removeAttribute('id');
    dropCoin.parentNode.insertBefore(roller, dropCoin.nextSibling);
    dropCoin.style.display = 'none';
    if (first) first.cancel();
    play(roller, [
      { transform: 'translate(130px, 40px) scale(1, 1)', opacity: 1, easing: 'ease-out' },
      { transform: 'translate(176px, -26px) scale(0.4, 1)', opacity: 1, offset: 0.35, easing: 'ease-in' },
      { transform: 'translate(214px, 30px) scale(1, 1)', opacity: 1, offset: 0.6, easing: 'ease-in' },
      { transform: 'translate(250px, 330px) scale(0.3, 1)', opacity: 0 }
    ], { duration: reduceMotion ? 300 : 950, fill: 'forwards' }, () => roller.remove());
    busy = false;
    wiggle();
    sparkle();
    say(line.full());
    setMood('happy', 1800);
  }

  /* ---------- Take a tip: the bouncing-button game ---------- */
  const G = { x: 0, y: 0, vx: 0, vy: 0, w: 0, h: 0, W: 0, H: 0, top: 0, raf: 0, last: 0, colour: 0, on: false };

  function measure() {
    G.W = document.documentElement.clientWidth || window.innerWidth;
    G.H = window.innerHeight;
    const r = robBtn.getBoundingClientRect();
    G.w = r.width;
    G.h = r.height + 4; // include the button's drop shadow
    G.top = panel.getBoundingClientRect().bottom + 10;
  }

  // The emptier the jar, the faster the button moves
  function speed() {
    const minDim = Math.max(320, Math.min(850, Math.min(G.W, G.H)));
    const emptiness = 1 - level / MAX_COINS;
    return minDim * (0.3 + 0.95 * emptiness); // pixels per second
  }

  function place() {
    robBtn.style.transform = `translate3d(${G.x.toFixed(1)}px, ${G.y.toFixed(1)}px, 0)`;
  }

  function openGame() {
    if (busy || level === 0) return;
    busy = true;
    setMood('nervous');
    say('');
    const lastCoin = level === 1;
    gamePrompt.textContent = lastCoin ? line.promptLast() : line.prompt();
    robInner.textContent = lastCoin ? line.robLast() : line.rob();
    game.hidden = false;
    G.colour = 0;
    robBtn.className = 'rob c0';
    measure();
    const maxX = Math.max(6, G.W - G.w - 6);
    const maxY = Math.max(G.top, G.H - G.h - 6);
    G.x = 6 + Math.random() * (maxX - 6);
    G.y = G.top + Math.random() * (maxY - G.top);
    const angle = Math.floor(Math.random() * 4) * (Math.PI / 2) + (25 + Math.random() * 40) * (Math.PI / 180);
    const s = speed();
    G.vx = Math.cos(angle) * s;
    G.vy = Math.sin(angle) * s;
    place();
    G.on = true;
    G.last = performance.now();
    G.raf = requestAnimationFrame(step);
    cancelBtn.focus({ preventScroll: true });
  }

  function step(now) {
    if (!G.on) return;
    const dt = Math.min(0.05, Math.max(0, (now - G.last) / 1000));
    G.last = now;
    const minX = 6, maxX = Math.max(minX, G.W - G.w - 6);
    const minY = G.top, maxY = Math.max(minY, G.H - G.h - 6);
    G.x += G.vx * dt;
    G.y += G.vy * dt;
    let hit = false;
    if (G.x < minX) { G.x = minX; G.vx = Math.abs(G.vx); hit = true; }
    else if (G.x > maxX) { G.x = maxX; G.vx = -Math.abs(G.vx); hit = true; }
    if (G.y < minY) { G.y = minY; G.vy = Math.abs(G.vy); hit = true; }
    else if (G.y > maxY) { G.y = maxY; G.vy = -Math.abs(G.vy); hit = true; }
    if (hit) bounce();
    place();
    G.raf = requestAnimationFrame(step);
  }

  function bounce() {
    // Nudge the angle a little so the path never settles into a loop
    const s = speed();
    const sx = Math.sign(G.vx) || 1, sy = Math.sign(G.vy) || 1;
    const a = Math.atan2(G.vy, G.vx) + (Math.random() - 0.5) * 0.3;
    let vx = Math.abs(Math.cos(a) * s), vy = Math.abs(Math.sin(a) * s);
    const minC = s * 0.3;
    if (vx < minC) { vx = minC; vy = Math.sqrt(s * s - minC * minC); }
    if (vy < minC) { vy = minC; vx = Math.sqrt(s * s - minC * minC); }
    G.vx = vx * sx;
    G.vy = vy * sy;
    G.colour = (G.colour + 1) % 3;
    robBtn.className = 'rob c' + G.colour;
    if (!reduceMotion) play(robInner, [{ transform: 'scale(1.1, 0.88)' }, { transform: 'none' }], { duration: 200, easing: 'ease-out' });
  }

  function stopGame() {
    G.on = false;
    cancelAnimationFrame(G.raf);
    game.hidden = true;
  }

  function cancelGame() {
    if (!G.on) return;
    stopGame();
    busy = false;
    say(line.cancel());
    setMood('happy', 1500);
    takeBtn.focus({ preventScroll: true });
  }

  function caught() {
    if (!G.on) return;
    stopGame();
    robbed();
  }

  function missed(x, y) {
    if (!canAnimate) return;
    const m = document.createElement('span');
    m.className = 'miss';
    m.textContent = line.miss();
    fx.appendChild(m);
    const at = `translate(${x}px, ${y}px)`;
    play(m, [
      { opacity: 0, transform: `${at} translate(-50%, -50%) scale(0.7)` },
      { opacity: 1, transform: `${at} translate(-50%, -90%) scale(1)`, offset: 0.25 },
      { opacity: 0, transform: `${at} translate(-50%, -190%) scale(1)` }
    ], { duration: 750, easing: 'ease-out' }, () => m.remove());
  }

  /* ---------- The sad bit ---------- */
  const FLY = '<svg viewBox="-38 -23 76 46" width="76" height="46">'
    + '<path class="wing-l" d="M-11,-3 C-20,-19 -36,-17 -35,-6 C-31,-9 -27,-8 -25,-4 C-31,-3 -32,4 -26,6 C-20,5 -15,3 -11,2 Z" fill="#FFFFFF" stroke="#3A9FCB" stroke-width="1.6" stroke-linejoin="round"/>'
    + '<path class="wing-r" d="M11,-3 C20,-19 36,-17 35,-6 C31,-9 27,-8 25,-4 C31,-3 32,4 26,6 C20,5 15,3 11,2 Z" fill="#FFFFFF" stroke="#3A9FCB" stroke-width="1.6" stroke-linejoin="round"/>'
    + '<circle r="13.5" fill="#F6C64F" stroke="#C98E1A" stroke-width="2"/>'
    + '<circle r="8.5" fill="none" stroke="#D9A12A" stroke-width="1.4"/>'
    + '<path d="M0,4.6 C-2.8,2.4 -4.4,1 -4.4,-0.9 A2.3,2.3 0 0 1 0,-1.8 A2.3,2.3 0 0 1 4.4,-0.9 C4.4,1 2.8,2.4 0,4.6 Z" fill="#E07E95"/>'
    + '</svg>';

  function flyAway(from) {
    const f = document.createElement('div');
    f.className = 'fly';
    f.innerHTML = FLY;
    fx.appendChild(f);
    const x0 = from.x, y0 = from.y, W = window.innerWidth;
    const k = (x, y, s, r) => `translate(${x}px, ${y}px) scale(${s}) rotate(${r}deg)`;
    play(f, [
      { transform: k(x0, y0, 0.5, 0), opacity: 0 },
      { transform: k(x0, y0 - 70, 1, -6), opacity: 1, offset: 0.15 },
      { transform: k(x0 + 45, y0 - 135, 1, 8), opacity: 1, offset: 0.38 },
      { transform: k(x0 + 5, y0 - 205, 1, -8), opacity: 1, offset: 0.58 },
      { transform: k(x0 + 70, y0 - 275, 1, 6), opacity: 1, offset: 0.76 },
      { transform: k(W + 90, -120, 0.9, 14), opacity: 1 }
    ], { duration: reduceMotion ? 700 : 2300, easing: 'ease-in-out', fill: 'forwards' }, () => f.remove());
  }

  function robbed() {
    const row = rows[level - 1];
    const from = toScreen(130, rowY(level - 1));
    level--;
    const last = level === 0;
    updateUI();
    setMood('sad', last ? 0 : 2400);
    say(level === 1 ? line.lastOne() : line.sad());
    play(row, [
      { transform: 'translateY(0px)', opacity: 1 },
      { transform: 'translateY(-26px)', opacity: 0 }
    ], { duration: 480, easing: 'ease-in', fill: 'forwards' }, (a) => {
      row.style.display = 'none';
      if (a) a.cancel();
    });
    flyAway(from);
    if (last) {
      // Let the last coin's goodbye play out before the cobweb appears
      setTimeout(() => {
        goEmpty();
        busy = false;
        tipBtn.focus({ preventScroll: true });
      }, reduceMotion ? 900 : 2200);
    } else {
      takeBtn.focus({ preventScroll: true });
      setTimeout(() => { busy = false; }, reduceMotion ? 400 : 1000);
    }
  }

  function goEmpty() {
    svg.classList.remove('leaving');
    svg.classList.add('is-empty');
    setMood('sleep');
    say(line.empty());
  }

  /* ---------- Wire it up ---------- */
  const DOWN = window.PointerEvent ? 'pointerdown' : 'mousedown';

  tipBtn.addEventListener('click', tip);
  takeBtn.addEventListener('click', openGame);
  cancelBtn.addEventListener('click', cancelGame);

  robBtn.addEventListener(DOWN, (e) => { e.preventDefault(); caught(); });
  if (!window.PointerEvent) robBtn.addEventListener('touchstart', (e) => { e.preventDefault(); caught(); }, { passive: false });
  robBtn.addEventListener('click', (e) => { if (e.detail === 0) caught(); }); // keyboard: Enter / Space

  game.addEventListener(DOWN, (e) => { if (e.target === game) missed(e.clientX, e.clientY); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && G.on) cancelGame(); });
  window.addEventListener('resize', () => { if (G.on) measure(); });

  if (level === 0) { svg.classList.add('is-empty'); setMood('sleep'); }
  else setMood('idle');
  updateUI();
})();
</script>
</body>
</html>
